# Public internet-facing NLB for CockroachDB SQL access from your Mac.
# See README-PUBLIC-NLB-Setup.md for security group and networking prerequisites.
#
# Before applying, set:
#   NLB_SG_WEST  — security group ID from Phase 2 (allows your IP on 26257/8080)
#   MY_IP        — your Mac's public IP (e.g. from: curl -s https://checkip.amazonaws.com)
#
# Apply:
#   export NLB_SG_WEST=sg-xxxxxxxx
#   export MY_IP=x.x.x.x
#   envsubst < nlb-us-west-2.yaml | kubectl apply -f - -n us-west-2 --context "$CONTEXT2"
#
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public-lb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: "${NLB_SG_WEST}"
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "${MY_IP}/32"
  selector:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: cockroachdb
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
